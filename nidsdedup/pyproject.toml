[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nidsdedup"
version = "0.1.0"
description = "Exact-duplicate audit and duplicate-aware splits for network intrusion detection benchmarks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "pandas>=1.5"]

[project.scripts]
nidsdedup = "nidsdedup.cli:main"
